[project]
name = "auto-invent"
version = "0.1.0"
description = "Autonomous Invention Lab subnet: protocol, gateway, validator, miner tooling"
requires-python = ">=3.12"

# Pins are load-bearing, not hygiene. The SDK line, the substrate plumbing and the
# crypto libraries determine what the chain sees and how bytes are signed; a minor
# version bump can change wire behaviour without changing any code here.
dependencies = [
    "bittensor==11.0.1",
    "async-substrate-interface==2.2.1",
    "cryptography==46.0.0",
    "bittensor-drand==2.0.0",
    "cbor2==5.6.5",
    "pydantic==2.9.2",
    # Bradley-Terry fitting (architecture.md 18.3). numpy only, deliberately: the
    # iterative majorisation-minimisation fit needs no optimiser, and adding scipy
    # would pull a large surface in for one function.
    "numpy==2.1.3",
    "pyyaml==6.0.2",
    # architecture.md 7.5: the validator's challenge-pack store.
    "redis==5.2.1",
    # The one provider surface (architecture.md 3.4.1). The OpenAI SDK speaks OpenRouter's
    # API directly; OpenRouter-only fields travel in `extra_body`.
    "openai==1.109.1",
]

[project.optional-dependencies]
gateway = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "httpx==0.27.2",
    "asyncpg==0.30.0",
]
validator = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "httpx==0.27.2",
    "asyncpg==0.30.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.122.3",
    "datamodel-code-generator==0.26.3",
    "ruff==0.8.4",
]

[project.scripts]
ail-miner = "miner.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The flat layout architecture.md section 24 specifies, rather than a src/ package.
packages = ["protocol", "chain", "gateway", "validator", "miner", "ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Determinism defects do not raise; they diverge. The suite runs under randomised hash
# seeds so dict-order dependence surfaces, and PYTHONHASHSEED must be set before the
# interpreter starts, so it lives in the Makefile rather than here.
markers = [
    "determinism: must reproduce under randomised iteration order",
    "adversarial: attack lab; asserts both that the attack fails and that evidence was recorded",
    "measurement: architecture.md section 27 mainnet gates",
    "chain: requires a local Bittensor network",
    "live: spends real money — needs Docker, a running gateway and both OpenRouter accounts",
]

[tool.ruff]
line-length = 100
# Generated from protocol/schemas/ and checked for drift by `make schema`. Linting it
# would invite hand edits, and every hand edit is reverted by the next regeneration.
extend-exclude = ["protocol/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection *is* a call in an argument default. B008 exists to catch a
# mutable default evaluated once at import; here that single evaluation is the framework's
# contract, and rewriting it to satisfy the rule would mean hand-resolving dependencies.
"gateway/api.py" = ["B008"]
# Same reason: `Body`/`Header` in a default is how FastAPI declares a route's inputs.
"demo/service.py" = ["B008"]
